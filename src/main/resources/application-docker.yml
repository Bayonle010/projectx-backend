server:
  port: 8082

spring:
  application:
    name : projectx

  docker:
    compose:
      enabled: false
  

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER_NAME}
    password: ${MAIL_PASSWORD}
    transport: smtp #api | smtp
    properties:
      mail:
        smtp:
          from: ${MAIL_FROM}

  devtools:
    restart:
      enabled: false


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email


  output:
    ansi:
      enabled: always



zeptomail:
  base-url: https://api.zeptomail.com/v1.1
  token: ${ZEPTOMAIL_TOKEN}
  from:
    address: noreply@project-x-house.space
    name: Projectx
  # optional defaults
  #  reply-to: support@project-x-house.space
  include-text: true

