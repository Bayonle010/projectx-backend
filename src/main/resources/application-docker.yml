server:
  port: 8082

spring:
  application:
    name: projectx

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER_NAME}
    password: ${MAIL_PASSWORD}
    transport: api
    properties:
      mail:
        smtp:
          from: ${MAIL_FROM}

  devtools:
    restart:
      enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

app:
  base-url: ${APP_BASE_URL}

  media:
    # Keep this at or below the maximum upload size allowed by your Cloudinary account.
    max-video-bytes: ${MAX_VIDEO_UPLOAD_BYTES:524288000}
    video-upload-preset: ${CLOUDINARY_VIDEO_UPLOAD_PRESET:}

  listing:
    friendly-id-prefix: ${LISTING_FRIENDLY_ID_PREFIX:PIL}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

zeptomail:
  base-url: https://api.zeptomail.com/v1.1
  token: ${ZEPTOMAIL_TOKEN}
  from:
    name: Projectx
  include-text: true

cloudinary:
  api:
    key: ${CLOUDINARY_API_KEY}
    secret: ${CLOUDINARY_API_SECRET}
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME}

openai:
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:350}
  connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:10000}
  response-timeout-ms: ${OPENAI_RESPONSE_TIMEOUT_MS:120000}
