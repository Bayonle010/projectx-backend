server:
  port: 8000

spring:
  application:
    name : projectx

  config:
    import: optional:file:.env.local[.properties]

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true


  docker:
    compose:
      enabled: false




