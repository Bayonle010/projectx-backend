name: projectx

services:
  db:
    image: postgres:17
    container_name: projectx-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: projectx-app
    restart: unless-stopped

    env_file:
      - /etc/projectx/.env

    expose:
      - "8082"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - proxy
      - backend


  nginx:
    image: nginx:stable-alpine
    container_name: projectx-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/${NGINX_CONFIG:-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

    depends_on:
      - app

    networks:
      - proxy


  certbot:
    image: certbot/certbot:latest
    container_name: projectx-certbot

    profiles:
      - tools

    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

    command:
      - certonly
      - --webroot
      - --webroot-path
      - /var/www/certbot
      - --email
      - ${CERTBOT_EMAIL}
      - --agree-tos
      - --non-interactive
      - --keep-until-expiring
      - -d
      - ${DOMAIN}

    networks:
      - proxy


networks:
  proxy:
    driver: bridge

  backend:
    driver: bridge
    internal: true


volumes:
  db_data:
  letsencrypt:
  certbot_www: