services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-x-app
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    networks:
      - project-x-network



  db:
    image: postgres:17
    container_name: projectx_postgres_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "5433:5432"
    command: [ "postgres", "-c", "listen_addresses=*" ]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DATABASE_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project-x-network




networks:
  project-x-network:
    driver: bridge

volumes:
  db_data: