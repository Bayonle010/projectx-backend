      name: projectx

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: projectx-app
    restart: unless-stopped

    env_file:
      - /etc/projectx/.env

    expose:
      - "8082"

    networks:
      - proxy

  nginx:
    image: nginx:stable-alpine
    container_name: projectx-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/${NGINX_CONFIG:-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

    depends_on:
      - app

    networks:
      - proxy

  certbot:
    image: certbot/certbot:latest
    container_name: projectx-certbot

    profiles:
      - tools

    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

    command:
      - certonly
      - --webroot
      - --webroot-path
      - /var/www/certbot
      - --email
      - ${CERTBOT_EMAIL}
      - --agree-tos
      - --non-interactive
      - --keep-until-expiring
      - -d
      - ${DOMAIN}

    networks:
      - proxy

networks:
  proxy:
    driver: bridge

volumes:
  letsencrypt:
  certbot_www:
